<!-- ============================================================ -->
<!-- CLAY ENGINE - TARGET HARI INI (v6.0 — simplified)            -->
<!-- ============================================================ -->

<div style="padding: 16px; color: #fff; max-width: 1400px; margin: 0 auto;">

  <!-- ============ HEADER ============ -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
    <div>
      <button id="btn-back-home"
        style="background: transparent; border: 1px solid #3a3a3e; color: #ccc; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; margin-bottom: 10px;">
        ← Kembali
      </button>
      <h2 style="margin: 0; font-size: 1.4rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px;">
        🎯 Target Pelanggan Hari Ini
      </h2>
      <p id="clay-engine-date" style="margin: 4px 0 0 0; font-size: 0.85rem; color: #8a8a93;">
        Memuat tanggal...
      </p>
    </div>
    <div style="display: flex; gap: 10px; align-items: center;">
      <button id="btn-refresh-clay"
        style="background: #2a2a2e; border: 1px solid #3a3a3e; color: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.8rem;">
        🔄 Refresh Data
      </button>
      <span style="background: rgba(0,230,118,0.15); border: 1px solid rgba(0,230,118,0.4); color: #00E676; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600;">
        Predict Today v6.0
      </span>
    </div>
  </div>

  <!-- ============ KPI CARDS ============ -->
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 28px;">
    <div style="background: #1c1c1e; padding: 16px; border-radius: 12px; border: 1px solid #2c2c2e; border-left: 4px solid #00E676;">
      <span style="font-size: 0.8rem; color: #8a8a93;">Target Hari Ini</span>
      <div id="stat-total-potensial" style="font-size: 1.4rem; font-weight: 700; color: #00E676; margin-top: 6px;">0 Pelanggan</div>
    </div>
    <div style="background: #1c1c1e; padding: 16px; border-radius: 12px; border: 1px solid #2c2c2e; border-left: 4px solid #ffc107;">
      <span style="font-size: 0.8rem; color: #8a8a93;">Total Proyeksi Omset Hari Ini</span>
      <div id="stat-total-omset" style="font-size: 1.4rem; font-weight: 700; color: #ffc107; margin-top: 6px;">Rp 0</div>
    </div>
    <div style="background: #1c1c1e; padding: 16px; border-radius: 12px; border: 1px solid #2c2c2e; border-left: 4px solid #28c8ff;">
      <span style="font-size: 0.8rem; color: #8a8a93;">Rata-rata Skor</span>
      <div id="stat-avg-score" style="font-size: 1.4rem; font-weight: 700; color: #28c8ff; margin-top: 6px;">—</div>
    </div>
  </div>

  <!-- ============ TABLE TARGET HARI INI ============ -->
  <div style="margin-bottom: 32px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
      <h3 style="margin: 0; font-size: 1.1rem; color: #fff; font-weight: 600;">
        🎯 Target Kedatangan Hari Ini
      </h3>
      <span id="badge-count-normal" style="font-size: 0.75rem; background: #2c2c2e; color: #ccc; padding: 4px 10px; border-radius: 12px;">
        0 items
      </span>
    </div>

    <div style="background: #1c1c1e; border: 1px solid #333338; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.35); overflow: hidden;">
      <div style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; text-align: left;">
          <thead>
            <tr style="background: #141416;">
              <th style="padding: 12px 14px; border-bottom: 2px solid #3f3f46; border-right: 1px solid #333338; color: #a1a1aa; font-weight: 600; font-size: 0.82rem; width: 50px;">No</th>
              <th style="padding: 12px 14px; border-bottom: 2px solid #3f3f46; border-right: 1px solid #333338; color: #a1a1aa; font-weight: 600; font-size: 0.82rem;">Nama Pelanggan</th>
              <th style="padding: 12px 14px; border-bottom: 2px solid #3f3f46; border-right: 1px solid #333338; color: #a1a1aa; font-weight: 600; font-size: 0.82rem;">Kategori</th>
              <th style="padding: 12px 14px; border-bottom: 2px solid #3f3f46; border-right: 1px solid #333338; color: #a1a1aa; font-weight: 600; font-size: 0.82rem;">Status</th>
              <th style="padding: 12px 14px; border-bottom: 2px solid #3f3f46; border-right: 1px solid #333338; color: #a1a1aa; font-weight: 600; font-size: 0.82rem;">Skor</th>
              <th style="padding: 12px 14px; border-bottom: 2px solid #3f3f46; border-right: 1px solid #333338; color: #a1a1aa; font-weight: 600; font-size: 0.82rem;">Siklus</th>
              <th style="padding: 12px 14px; border-bottom: 2px solid #3f3f46; border-right: 1px solid #333338; color: #a1a1aa; font-weight: 600; font-size: 0.82rem;">Kode Pelanggan</th>
              <th style="padding: 12px 14px; border-bottom: 2px solid #3f3f46; border-right: 1px solid #333338; color: #a1a1aa; font-weight: 600; font-size: 0.82rem;">No HP</th>
              <th style="padding: 12px 14px; border-bottom: 2px solid #3f3f46; color: #a1a1aa; font-weight: 600; font-size: 0.82rem; text-align: center; width: 90px;">WA</th>
            </tr>
          </thead>
          <tbody id="tbody-predict">
            <tr>
              <td colspan="9" style="text-align: center; padding: 24px; color: #888;">Memuat data prediksi hari ini...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>
