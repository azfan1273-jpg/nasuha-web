<div class="database-container">
  <div class="section-header">
    <h2>Database Transaksi Laundry</h2>
    <button class="btn-primary" id="btn-add-data">+ Tambah Transaksi</button>
  </div>

  <!-- Table Container -->
  <div class="table-card">
    <div class="table-header">
      <h3>Daftar Transaksi</h3>
      <input type="text" class="search-input" placeholder="Cari nota / pelanggan..." id="search-db">
    </div>

    <div class="table-wrapper">
      <table class="custom-table">
        <thead>
          <!-- Header Baris 1 -->
          <tr>
            <th rowspan="2">ID</th>
            <th rowspan="2">Nota Number</th>
            <th rowspan="2">Nama Pelanggan</th>
            <th rowspan="2">Layanan</th>
            <th rowspan="2">Total Price</th>
            <th rowspan="2">Status</th>
            <th rowspan="2">Metode</th>
            <!-- Sub-header Tanggal Span 3 Kolom -->
            <th colspan="3" class="text-center th-tanggal-group">Tanggal</th>
            <th rowspan="2">Diskon</th>
            <th rowspan="2">Catatan</th>
            <th rowspan="2">Aksi</th>
          </tr>
          <!-- Header Baris 2 (Sub-kolom Tanggal) -->
          <tr>
            <th class="sub-th">Masuk</th>
            <th class="sub-th">Estimasi</th>
            <th class="sub-th">Pelunasan</th>
          </tr>
        </thead>

        <!-- Tempat JS menyuntikkan data real -->
        <tbody id="db-table-body">
          <!-- Contoh Baris Data Dummy / Preview Layout -->
          <tr>
            <td>1</td>
            <td><strong>#NOTA-1001</strong></td>
            <td>Adytia</td>
            <td>Cuci Komplit</td>
            <td>Rp 45.000</td>
            <td><span class="badge badge-warning">Proses</span></td>
            <td>QRIS</td>
            <td>10/09/26 08:00</td>
            <td>11/09/26 16:00</td>
            <td>-</td>
            <td>Rp 5.000</td>
            <td>Wangi Lavender</td>
            <td>
              <button class="btn-sm btn-edit">Edit</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
