<div class="top-header">

  <!-- ============ LEFT: Breadcrumb ============ -->
  <div class="header-left">
    <div class="breadcrumb">
      <span class="breadcrumb-item">Nasuha</span>
      <span class="breadcrumb-sep">/</span>
      <span id="current-page-title" class="breadcrumb-current">Database</span>
    </div>
  </div>

  <!-- ============ RIGHT: Actions ============ -->
  <div class="header-right">

    <!-- Search (desktop only) -->
    <div class="header-search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" placeholder="Search..." />
      <span class="header-kbd">Ctrl K</span>
    </div>

    <!-- Connect button -->
    <button class="header-connect" title="Connect to project">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <span>Connect</span>
    </button>

    <!-- Icon buttons -->
    <button class="action-btn" title="Notifications">🔔</button>

    <!-- User profile -->
    <div class="user-profile" id="user-profile-btn">
      <div class="user-icon-wrapper">
        <span class="user-icon">🧺</span>
      </div>
      <div id="header-user-text" class="user-text-group">
        <span class="text-login">Login</span>
        <span class="text-separator">/</span>
        <span class="text-register">Register</span>
      </div>
    </div>

  </div>
</div>
